name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check-types
      # Creating a project makes its first commit, which needs an identity. Runners have none.
      - run: git config --global user.name "Den CI" && git config --global user.email "ci@den.local"
      - run: bun test
      # The desktop app has its own job because it needs Rust and system libraries.
      - run: bunx turbo run build --filter=!desktop

  migrations:
    name: Migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: den
          POSTGRES_PASSWORD: den
          POSTGRES_DB: den
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U den -d den"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://den:den@localhost:5432/den
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Migrations are committed for every schema change
        run: |
          (cd packages/db-cloud && bun run generate:migration)
          (cd apps/daemon && bun run db:generate)
          if [ -n "$(git status --porcelain -- packages/db-cloud/drizzle apps/daemon/src/database/migrations)" ]; then
            echo "::error::A schema changed without a migration. Run the generate script and commit the result."
            git status --porcelain -- packages/db-cloud/drizzle apps/daemon/src/database/migrations
            exit 1
          fi
      - run: cd packages/db-cloud && bunx --bun drizzle-kit check
      - name: Migrations apply to an empty database
        run: bun run db:migrate
      - name: Migrating again changes nothing
        run: bun run db:migrate

  desktop:
    name: Desktop build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=desktop
