[package]
name = "den"
version = "0.1.0"
description = "Run Claude Code and Codex in parallel"
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "den_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2.10.1"
tauri-plugin-shell = "2.6.0"
getrandom = "0.4.3"
tokio = { version = "1.54.1", features = ["sync", "time"] }
# CommandChild cannot close stdin and keep a handle to kill the daemon later, so the kill goes by pid.
libc = "0.2.191"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
