# Local services for contributors. Production uses Neon and a managed Redis.
# Keep the Postgres major version equal to the Neon project's.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: octopus
      POSTGRES_PASSWORD: octopus
      POSTGRES_DB: octopus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - octopus-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octopus -d octopus"]
      interval: 2s
      timeout: 5s
      retries: 15

  # BullMQ queues for the cloud worker.
  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - octopus-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  octopus-postgres:
  octopus-redis:
