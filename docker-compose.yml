# Local services for contributors. Production uses Neon and a managed Redis.
# Keep the Postgres major version equal to the Neon project's.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: swarm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - swarm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm -d swarm"]
      interval: 2s
      timeout: 5s
      retries: 15

  # BullMQ queues for the cloud worker.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - swarm-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  swarm-postgres:
  swarm-redis:
